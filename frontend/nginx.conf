# 클라이언트가 보낸 X-Forwarded-For는 신뢰하지 않는다(위조로 IP별 횟수 제한을 우회할 수 있다).
# Tailscale Funnel 뒤에서는 모든 요청이 같은 주소로 보이므로 IP별 제한은 사실상 전역 제한이 되고,
# 계정·이메일별 제한이 주 방어선이다. Cloudflare Tunnel로 옮기면 cloudflared 주소만 신뢰하고
# real_ip_header CF-Connecting-IP 를 쓴다(Cloudflare가 항상 덮어쓰는 헤더).

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API와 Google 로그인 경로(/oauth2/authorization/*, /login/oauth2/code/*)는 API로 보낸다
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://api:8080;
        # 포트를 포함한 원래 호스트(OAuth 콜백 주소 계산에 필요)
        proxy_set_header Host $http_host;
        # 클라이언트가 보낸 X-Forwarded-For는 버리고, 위에서 검증한 주소 하나만 넘긴다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
